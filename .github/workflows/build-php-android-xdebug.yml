name: Build PHP binary (Android, with Xdebug)

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
        default: 5
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
        default: '8.3'

env:
  MUSL_CROSS_MAKE_VERSION: b7b27ee2f37b5794658dce8a611f91feb456bf91

jobs:
  android-debug:
    name: Android arm64 (Xdebug build)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Ensure compile.sh is executable
        run: chmod +x compile.sh

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: axolotl-pm/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        id: build-compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      # actions/cache@v6's implicit post-job save can be skipped in some
      # circumstances (e.g. depending on how later steps in this job fail).
      # Since this compiler build takes a long time and doesn't depend on
      # anything that changes later in the job, save it explicitly right
      # here, right after it's built. Guarded on the build step's own
      # success (not just `always()`) so a broken/partial compiler build
      # never gets saved under this key.
      - name: Save compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true' && steps.build-compiler.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      # compile.sh in this repo already has the Xdebug/static-build fixes
      # baked in directly (no static-mode HAVE_XDEBUG override, Xdebug's
      # ./configure includes $CONFIGURE_FLAGS and -static-libgcc). The only
      # remaining fix that has to happen here rather than in compile.sh
      # itself is filesystem-level and needs root, so it stays a CI step:
      #
      # ld --verbose (run against the real toolchain's ld binary) shows its
      # default SEARCH_DIR entries are all absolute root-level paths -
      # /aarch64-linux-musl/lib, /lib64, /usr/lib, etc - hardcoded at the
      # time this toolchain was built, not resolved relative to wherever
      # it's actually installed. Since the toolchain lives under
      # .../compiler/ on this runner rather than at the filesystem root,
      # none of ld's real default search dirs exist here - so this
      # toolchain can never find a normal libgcc_s.so and Xdebug's -shared
      # link (linking against -lgcc_s) fails with "cannot find -lgcc_s".
      # Every attempt to place a workaround file under .../compiler/... was
      # confirmed not to work; only creating the real /aarch64-linux-musl/lib
      # at the actual filesystem root (using the runner's passwordless
      # sudo) and placing it there worked, since that's the literal path
      # ld itself reports searching.
      - name: Work around missing libgcc_s.so in musl-cross-make toolchain
        run: |
          set -ex
          COMPILER_ROOT="${{ github.workspace }}/compiler"
          GCC="$COMPILER_ROOT/bin/aarch64-linux-musl-gcc"
          LD="$COMPILER_ROOT/aarch64-linux-musl/bin/ld"

          test -x "$LD"
          GCC_LIBDIR="$("$GCC" -print-libgcc-file-name | xargs dirname)"
          test -f "$GCC_LIBDIR/libgcc.a"
          LINKER_SCRIPT="GROUP ( $GCC_LIBDIR/libgcc.a )"

          echo "=== ld's real default search dirs (ground truth) ==="
          "$LD" --verbose | grep -o 'SEARCH_DIR([^)]*)'

          # Create the real absolute-root sysroot dir ld actually searches
          sudo mkdir -p /aarch64-linux-musl/lib
          echo "$LINKER_SCRIPT" | sudo tee /aarch64-linux-musl/lib/libgcc_s.so > /dev/null
          test -f /aarch64-linux-musl/lib/libgcc_s.so
          cat /aarch64-linux-musl/lib/libgcc_s.so
          echo "Placed libgcc_s.so at the real /aarch64-linux-musl/lib (matches ld's own SEARCH_DIR output)"

          # Belt-and-braces: also cover the toolchain-relative dirs from
          # earlier attempts, in case ld's actual runtime search order
          # differs subtly from --verbose's reported defaults.
          for dir in "$COMPILER_ROOT/aarch64-linux-musl/lib" "$GCC_LIBDIR"; do
            if [ -d "$dir" ] && [ -w "$dir" ] && [ ! -e "$dir/libgcc_s.so" ]; then
              echo "$LINKER_SCRIPT" > "$dir/libgcc_s.so"
              echo "Also placed (fallback) in: $dir"
            fi
          done

      - name: Compile PHP with Xdebug (static, Android arm64)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t android-aarch64 -x -j "$(nproc)" -P ${{ inputs.pm-version-major }} -c ./download_cache -z ${{ inputs.php-version-base }}

      - name: Verify xdebug.so was actually built
        run: |
          find bin/php7 -iname 'xdebug.so' -print
          test -n "$(find bin/php7 -iname 'xdebug.so')"

      - name: Create tarball
        run: |
          tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}-xdebug.tar.gz bin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-PM${{ inputs.pm-version-major }}-xdebug
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}-xdebug*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error
