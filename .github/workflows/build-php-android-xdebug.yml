name: Build PHP binary (Android, with Xdebug)

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
        default: 5
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
        default: '8.3'

env:
  MUSL_CROSS_MAKE_VERSION: b7b27ee2f37b5794658dce8a611f91feb456bf91

jobs:
  android-debug:
    name: Android arm64 (Xdebug build)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: axolotl-pm/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        id: build-compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      # actions/cache@v6's implicit post-job save can be skipped in some
      # circumstances (e.g. depending on how later steps in this job fail).
      # Since this compiler build takes a long time and doesn't depend on
      # anything that changes later in the job (patches, PHP/Xdebug compile),
      # save it explicitly right here, right after it's built, rather than
      # relying on an implicit end-of-job save that may not fire if a later
      # step fails. Guarded on the build step's own success (not just
      # `always()`) so a broken/partial compiler build never gets saved
      # under this key - that would poison the cache for every future run
      # until the version string is bumped.
      - name: Save compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true' && steps.build-compiler.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      # compile.sh unconditionally sets HAVE_XDEBUG=no once DO_STATIC=yes,
      # since Xdebug is not normally expected to work well in a fully-static
      # cross-compiled binary. This build is for local debugging only (not
      # a production release), so we patch that guard out and let the
      # Xdebug extension build against the static/musl toolchain anyway.
      - name: Patch compile.sh to allow Xdebug on static builds
        run: |
          python3 - <<'EOF'
          import re
          with open('compile.sh') as f:
              content = f.read()

          pattern = re.compile(
              r'if \[ "\$HAVE_XDEBUG" == "yes" \]; then\n'
              r'\s*write_out "warning" "Xdebug cannot be built in static mode"\n'
              r'\s*HAVE_XDEBUG="no"\n'
              r'\s*fi\n'
          )
          new_content, n = pattern.subn(
              'if [ "$HAVE_XDEBUG" == "yes" ]; then\n'
              '\t  write_out "warning" "Xdebug on a static build is experimental/debug-only"\n'
              '\tfi\n',
              content,
          )
          if n == 0:
              raise SystemExit("ERROR: could not find the Xdebug static-mode guard block to patch - compile.sh has likely changed upstream, update this workflow")
          with open('compile.sh', 'w') as f:
              f.write(new_content)
          print(f"Patched {n} occurrence(s)")
          EOF
          # Fail loudly if the patch didn't actually take effect
          grep -q 'Xdebug on a static build is experimental/debug-only' compile.sh

      # The Xdebug build step in compile.sh never forwards $CONFIGURE_FLAGS
      # (which carries --host=aarch64-linux-musl on this cross-compile
      # target) to Xdebug's own ./configure. Every other bundled library in
      # the script does pass this. Without it, autoconf tries to run a
      # target-arch test binary on the build host and aborts with
      # "checking whether we are cross compiling... configure: error: ...".
      #
      # Separately: this toolchain (musl-cross-make) only ships a static
      # libgcc.a, no libgcc_s.so. Xdebug's libtool-generated link rules
      # default to linking `-lgcc_s` and fail with "cannot find -lgcc_s"
      # unless -static-libgcc is known to libtool *at configure time* - it
      # is baked into libtool's generated link command and is NOT reliably
      # picked up by setting CFLAGS/LDFLAGS on the later `make` invocation.
      # So both fixes are applied together, on the ./configure line, via
      # environment variables that libtool's configure probe will capture.
      - name: Patch compile.sh to fix Xdebug cross-compile configure (host + static-libgcc)
        run: |
          python3 - <<'EOF'
          with open('compile.sh') as f:
              content = f.read()

          old = './configure --with-php-config="$INSTALL_DIR/bin/php-config" >> "$DIR/install.log" 2>&1'
          new = 'CFLAGS="$CFLAGS -static-libgcc" LDFLAGS="$LDFLAGS -static-libgcc" ./configure --with-php-config="$INSTALL_DIR/bin/php-config" $CONFIGURE_FLAGS >> "$DIR/install.log" 2>&1'

          n = content.count(old)
          if n == 0:
              raise SystemExit("ERROR: could not find the Xdebug ./configure line to patch - compile.sh has likely changed upstream, update this workflow")
          if n > 1:
              raise SystemExit(f"ERROR: expected exactly 1 match for the Xdebug ./configure line, found {n} - update this workflow to disambiguate")

          content = content.replace(old, new)
          with open('compile.sh', 'w') as f:
              f.write(content)
          print("Patched Xdebug ./configure line to include $CONFIGURE_FLAGS and -static-libgcc")
          EOF
          # Fail loudly if the patch didn't actually take effect
          grep -q 'with-php-config="\$INSTALL_DIR/bin/php-config" \$CONFIGURE_FLAGS' compile.sh
          grep -q 'static-libgcc.*with-php-config' compile.sh

      # Confirmed root cause (from an actual failed build's install.log):
      # libtool's `-shared` link mode for xdebug.so drops -static-libgcc
      # from the final `gcc -shared ...` command entirely - libtool treats
      # it as compile-only and strips it during its link-mode translation,
      # regardless of where it's set (configure-time or make-time). So the
      # final link always references `-lgcc_s`, which this musl-cross-make
      # toolchain never built (it only produced a static libgcc.a).
      #
      # Fix: give the linker something to find under that name. We create
      # a linker script named libgcc_s.so in the toolchain's lib directory
      # that simply pulls in the real static libgcc.a - this is the
      # standard workaround for musl toolchains missing libgcc_s.so
      # (used by several other cross-compiled projects hitting this exact
      # issue). Placed in a directory already on the linker's search path
      # for this toolchain so no extra -L flag is needed.
      - name: Work around missing libgcc_s.so in musl-cross-make toolchain
        run: |
          set -ex
          GCC_LIBDIR="$(${{ github.workspace }}/compiler/bin/aarch64-linux-musl-gcc -print-libgcc-file-name | xargs dirname)"
          test -f "$GCC_LIBDIR/libgcc.a"
          test ! -e "$GCC_LIBDIR/libgcc_s.so"
          echo "GROUP ( $GCC_LIBDIR/libgcc.a )" > "$GCC_LIBDIR/libgcc_s.so"
          cat "$GCC_LIBDIR/libgcc_s.so"

      - name: Compile PHP with Xdebug (static, Android arm64)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t android-aarch64 -x -j "$(nproc)" -P ${{ inputs.pm-version-major }} -c ./download_cache -z ${{ inputs.php-version-base }}

      - name: Enable Xdebug in generated php.ini
        run: |
          set -ex
          INI="bin/php7/bin/php.ini"
          test -f "$INI"
          # flip the commented-out xdebug lines on, default to a safe mode
          sed -i 's/^;zend_extension=xdebug.so/zend_extension=xdebug.so/' "$INI"
          sed -i 's/^xdebug.mode=off/xdebug.mode=develop,profile/' "$INI"
          echo "xdebug.output_dir=/data/data/com.termux/files/home/xdebug-out" >> "$INI"
          grep -q '^zend_extension=xdebug.so' "$INI"
          cat "$INI"

      - name: Verify xdebug.so was actually built
        run: |
          find bin/php7 -iname 'xdebug.so' -print
          test -n "$(find bin/php7 -iname 'xdebug.so')"

      - name: Create tarball
        run: |
          tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}-xdebug.tar.gz bin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-PM${{ inputs.pm-version-major }}-xdebug
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}-xdebug*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

      - name: Prepare workspace for upload
        if: failure()
        run: tar -czf workspace.tar.gz install_data

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-workspace-PM${{ inputs.pm-version-major }}-xdebug
          path: |
            workspace.tar.gz
          if-no-files-found: error
          
