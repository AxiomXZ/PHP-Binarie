name: Build PHP binary (Android, with Xdebug)

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
        default: 5
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
        default: '8.3'

env:
  MUSL_CROSS_MAKE_VERSION: b7b27ee2f37b5794658dce8a611f91feb456bf91
  # Bump this whenever config.mak's content changes (e.g. new compiler
  # flags) - the cache key below is not sensitive to config.mak on its
  # own, since it's generated inline in the Build compiler step rather
  # than being a real file in this repo that hashFiles() could see.
  TOOLCHAIN_CONFIG_VERSION: pic-fix-1

jobs:
  android-debug:
    name: Android arm64 (Xdebug build)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Ensure compile.sh is executable
        run: chmod +x compile.sh

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v6
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-${{ env.TOOLCHAIN_CONFIG_VERSION }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: axolotl-pm/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      # ROOT CAUSE (confirmed via a manual replay of the real failing link
      # command, with -Wl,--verbose): once the libgcc_s.so workaround was
      # in place, the link progressed past -lgcc_s cleanly, then failed on
      # a DIFFERENT, more fundamental problem:
      #   libc.a(getenv.o): relocation R_AARCH64_ADR_PREL_PG_HI21 against
      #   symbol `__environ' ... can not be used when making a shared
      #   object; recompile with -fPIC
      # This musl-cross-make toolchain's libc.a was built without -fPIC,
      # so it can never be linked into any shared object (.so) - not
      # specific to Xdebug, this would block ANY PHP extension trying to
      # build as a loadable .so against this toolchain. musl-cross-make's
      # own config.mak mechanism (confirmed via the project's own mailing
      # list: https://www.openwall.com/lists/musl/2017/12/21/1) is the
      # correct place to fix this - MUSL_CONFIG's CFLAGS is passed through
      # to musl's own ./configure step when building libc.a itself.
      # (libgcc is -fPIC by default already, per the same source - only
      # musl's libc needs the explicit flag.)
      - name: Build compiler
        id: build-compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          echo 'MUSL_CONFIG += CFLAGS="-fPIC"' >> config.mak
          cat config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      # actions/cache@v6's implicit post-job save can be skipped in some
      # circumstances (e.g. depending on how later steps in this job fail).
      # Since this compiler build takes a long time and doesn't depend on
      # anything that changes later in the job, save it explicitly right
      # here, right after it's built. Guarded on the build step's own
      # success (not just `always()`) so a broken/partial compiler build
      # never gets saved under this key.
      - name: Save compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true' && steps.build-compiler.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-${{ env.TOOLCHAIN_CONFIG_VERSION }}

      # compile.sh in this repo already has all the Xdebug/static-build
      # fixes baked in directly (no static-mode HAVE_XDEBUG override,
      # Xdebug's ./configure includes $CONFIGURE_FLAGS and -static-libgcc,
      # and the libgcc_s.so filesystem workaround for the android-aarch64
      # toolchain, which needs sudo and runs automatically inside the
      # script itself when compiling for Android with Xdebug enabled) - no
      # separate CI-side patching or workaround steps needed.

      - name: Compile PHP with Xdebug (static, Android arm64)
        id: compile_php
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t android-aarch64 -x -j "$(nproc)" -P ${{ inputs.pm-version-major }} -c ./download_cache -z ${{ inputs.php-version-base }}

      # DIAGNOSTIC ONLY - runs only if the compile step above failed.
      # Replays the exact failing gcc -shared link command from
      # install.log by hand, with -Wl,--verbose appended directly on the
      # command line (not through CFLAGS/LDFLAGS/configure, which we've
      # already confirmed libtool doesn't reliably forward into the actual
      # link it executes). This shows ld's real behavior - which linker
      # script it's using, what search paths it actually consults, why it
      # still can't find -lgcc_s despite a file existing at the path
      # standalone `ld --verbose` reported - without relying on any flag
      # surviving through the normal build machinery.
      - name: DIAGNOSTIC - replay the failing Xdebug link command with verbose linker output
        if: failure() && steps.compile_php.outcome == 'failure'
        run: |
          set -x
          XDEBUG_DIR="install_data/subdir/php/ext/xdebug"
          if [ ! -d "$XDEBUG_DIR" ]; then
            echo "Xdebug build dir not found at $XDEBUG_DIR - cannot replay, listing what exists instead:"
            find install_data -maxdepth 4 -iname 'xdebug*' 2>/dev/null || true
            exit 0
          fi
          cd "$XDEBUG_DIR"

          export PATH="${{ github.workspace }}/compiler/bin:$PATH"

          echo "=== Confirming the workaround file's actual state right now ==="
          ls -la /aarch64-linux-musl/lib/ 2>&1 || echo "/aarch64-linux-musl/lib does not exist at all"
          cat /aarch64-linux-musl/lib/libgcc_s.so 2>&1 || echo "cannot read /aarch64-linux-musl/lib/libgcc_s.so"

          echo "=== Replaying the real failing link command with -Wl,--verbose ==="
          aarch64-linux-musl-gcc -shared \
            .libs/xdebug.o src/base/.libs/base.o src/base/.libs/ctrl_socket.o src/base/.libs/filter.o \
            src/lib/.libs/usefulstuff.o src/lib/.libs/cmd_parser.o src/lib/.libs/compat.o src/lib/.libs/crc32.o \
            src/lib/.libs/file.o src/lib/.libs/hash.o src/lib/.libs/headers.o src/lib/.libs/lib.o \
            src/lib/.libs/llist.o src/lib/.libs/log.o src/lib/.libs/normalize_path.o src/lib/.libs/set.o \
            src/lib/.libs/str.o src/lib/.libs/timing.o src/lib/.libs/trim.o src/lib/.libs/var.o \
            src/lib/.libs/var_export_html.o src/lib/.libs/var_export_line.o src/lib/.libs/var_export_text.o \
            src/lib/.libs/var_export_xml.o src/lib/.libs/xdebug_strndup.o src/lib/.libs/xml.o \
            src/lib/maps/.libs/maps.o src/lib/maps/.libs/maps_private.o src/lib/maps/.libs/parser.o \
            src/coverage/.libs/branch_info.o src/coverage/.libs/code_coverage.o src/debugger/.libs/com.o \
            src/debugger/.libs/debugger.o src/debugger/.libs/handler_dbgp.o src/debugger/.libs/handlers.o \
            src/debugger/.libs/ip_info.o src/develop/.libs/develop.o src/develop/.libs/monitor.o \
            src/develop/.libs/php_functions.o src/develop/.libs/stack.o src/develop/.libs/superglobals.o \
            src/gcstats/.libs/gc_stats.o src/profiler/.libs/profiler.o src/tracing/.libs/trace_computerized.o \
            src/tracing/.libs/trace_flamegraph.o src/tracing/.libs/trace_html.o src/tracing/.libs/trace_textual.o \
            src/tracing/.libs/tracing.o \
            -L"${{ github.workspace }}/bin/php7/lib" -lm -lz \
            -march=armv8-a -mtune=generic \
            -Wl,-static -Wl,-rpath -Wl,"${{ github.workspace }}/bin/php7/lib" \
            -Wl,-soname -Wl,xdebug.so -Wl,--verbose \
            -o /tmp/xdebug_diag_test.so 2>&1 | tail -150

      - name: Verify xdebug.so was actually built
        run: |
          find bin/php7 -iname 'xdebug.so' -print
          test -n "$(find bin/php7 -iname 'xdebug.so')"

      - name: Create tarball
        run: |
          tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}-xdebug.tar.gz bin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-PM${{ inputs.pm-version-major }}-xdebug
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm64-PM${{ inputs.pm-version-major }}-xdebug*.tar.gz
            install.log
            compile.sh
          if-no-files-found: error
